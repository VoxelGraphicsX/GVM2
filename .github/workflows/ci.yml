name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hygiene:
    name: Static hygiene
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check tracked source distribution
        run: node tests/runners/node/check-source-distribution.mjs

  install-smoke:
    name: Install/export smoke
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        logging: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun clang++ --version
      - name: Configure
        run: |
          cmake -S . -B build/gvm-install-check-${{ matrix.logging }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DGVM_BUILD_TESTS=OFF \
            -DGVM_BUILD_SAMPLES=OFF \
            -DGVM_BUILD_UGLC=ON \
            -DGVM_INSTALL=ON \
            -DGVM_RHI_ENABLE_LOGGING=${{ matrix.logging }}
      - name: Build
        run: cmake --build build/gvm-install-check-${{ matrix.logging }} --target all -j 3
      - name: Install
        run: cmake --install build/gvm-install-check-${{ matrix.logging }} --prefix build/gvm-install-prefix-${{ matrix.logging }}
      - name: Downstream generated-code consumer
        run: |
          resource_dir=$(sed -n 's/^GVM_UGLC_RESOURCE_DIR:PATH=//p' build/gvm-install-check-${{ matrix.logging }}/CMakeCache.txt)
          cmake -S tests/install \
            -B build/gvm-smoke-consumer-${{ matrix.logging }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/gvm-install-prefix-${{ matrix.logging }}" \
            -DGVM_UGLC_EXECUTABLE="$PWD/build/gvm-install-check-${{ matrix.logging }}/UGLC" \
            -DGVM_UGLC_RESOURCE_DIR="$resource_dir"
          cmake --build build/gvm-smoke-consumer-${{ matrix.logging }} --parallel 3
          ctest --test-dir build/gvm-smoke-consumer-${{ matrix.logging }} --output-on-failure
      - name: Verify shared dependency configuration and rejection
        run: >-
          node tests/install/check-dependencies.mjs
          --consumer-build build/gvm-smoke-consumer-${{ matrix.logging }}
      - name: Verify parent fmt reuse in source and installed consumers
        if: matrix.logging == 'ON'
        run: |
          cmake -S tests/fmt -B build/gvm-fmt-source \
            -DCMAKE_BUILD_TYPE=Release -DGVM_TEST_SOURCE_DIR="$PWD"
          cmake --build build/gvm-fmt-source --parallel 3
          ctest --test-dir build/gvm-fmt-source --output-on-failure
          cmake -S tests/fmt -B build/gvm-fmt-installed \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/gvm-install-prefix-ON"
          cmake --build build/gvm-fmt-installed --parallel 3
          ctest --test-dir build/gvm-fmt-installed --output-on-failure

  tests:
    name: Legacy ${{ matrix.legacy }} / GVM ${{ matrix.backend }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        legacy: ['OFF', 'ON']
        backend: [metal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun clang++ --version
      - name: Configure isolated test build
        run: |
          cmake -S . -B build/compiler-tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGVM_BUILD_SAMPLES=OFF \
            -DGVM_BUILD_ADVANCED_SAMPLES=OFF \
            -DGVM_BUILD_THREE_SAMPLES=OFF \
            -DGVM_BUILD_TESTS=ON \
            -DUGLC_ENABLE_LEGACY=${{ matrix.legacy }}
      - name: Build compiler and backend tests
        id: build
        run: cmake --build build/compiler-tests --parallel 3
      - name: Verify test registration and execution guards
        run: node --test tests/runners/uglc/node/uglir-contract.test.mjs tests/runners/node/execution-contract.test.mjs tests/runners/uglc/node/readiness-metrics.test.mjs tests/runners/uglc/node/candidate-audit.test.mjs tests/runners/shared/output-policy.test.mjs tests/runners/shared/report-redaction.test.mjs
      - name: Run UGLC tests
        run: >-
          node tests/runners/uglc/node/cli.mjs run --group all
          --build-dir build/compiler-tests --no-build true --no-open-report true
      - name: Run GVM tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node tests/runners/node/cli.mjs run --profile macos-debug --group all
          --build-dir build/compiler-tests --backend ${{ matrix.backend }} --no-open-report true

  native-vulkan-candidate:
    name: Native Vulkan candidate evidence
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, vulkan-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure UGLIR build on native hardware
        run: |
          cmake -S . -B build/native-vulkan-candidate \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGVM_BUILD_SAMPLES=OFF \
            -DGVM_BUILD_ADVANCED_SAMPLES=OFF \
            -DGVM_BUILD_THREE_SAMPLES=OFF \
            -DGVM_BUILD_TESTS=ON \
            -DUGLC_ENABLE_LEGACY=ON
      - name: Build
        id: build
        run: cmake --build build/native-vulkan-candidate --parallel 3
      - name: Run complete compiler suite
        run: >-
          node tests/runners/uglc/node/cli.mjs run --group all
          --build-dir build/native-vulkan-candidate --no-build true --no-open-report true
      - name: Run complete native Vulkan backend suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node tests/runners/node/cli.mjs run --profile vulkan-debug --group all --backend vulkan
          --build-dir build/native-vulkan-candidate --no-open-report true

  native-vulkan-macos:
    name: Native macOS KosmicKrisp Vulkan candidate evidence
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, macos, ARM64, vulkan-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure UGLIR build with KosmicKrisp runtime
        run: |
          cmake -S . -B build/native-vulkan-macos \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGVM_BUILD_SAMPLES=OFF \
            -DGVM_BUILD_ADVANCED_SAMPLES=OFF \
            -DGVM_BUILD_THREE_SAMPLES=OFF \
            -DGVM_BUILD_TESTS=ON \
            -DUGLC_ENABLE_LEGACY=OFF
          grep -q '^GVM_KOSMICKRISP_SDK:PATH=/' build/native-vulkan-macos/CMakeCache.txt
      - name: Build
        id: build
        run: cmake --build build/native-vulkan-macos --parallel 3
      - name: Run complete compiler suite
        run: >-
          node tests/runners/uglc/node/cli.mjs run --group all
          --build-dir build/native-vulkan-macos --no-build true --no-open-report true
      - name: Run complete macOS KosmicKrisp Vulkan backend suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          node tests/runners/node/cli.mjs run --profile macos-debug --group all --backend vulkan
          --build-dir build/native-vulkan-macos --no-open-report true

  windows-install-smoke:
    name: Windows install/export smoke
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        logging: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/gvm-install-check-${{ matrix.logging }} -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGVM_BUILD_TESTS=OFF `
            -DGVM_BUILD_SAMPLES=OFF `
            -DGVM_BUILD_UGLC=ON `
            -DGVM_INSTALL=ON `
            -DGVM_RHI_ENABLE_LOGGING=${{ matrix.logging }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: cmake --build build/gvm-install-check-${{ matrix.logging }} --target all -j 3
      - name: Install
        shell: pwsh
        run: cmake --install build/gvm-install-check-${{ matrix.logging }} --prefix build/gvm-install-prefix-${{ matrix.logging }}
      - name: Downstream generated-code consumer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $cacheLines = Get-Content build/gvm-install-check-${{ matrix.logging }}/CMakeCache.txt
          $resourceLine = $cacheLines | Where-Object { $_ -like 'GVM_UGLC_RESOURCE_DIR:PATH=*' } | Select-Object -First 1
          $resourceDir = $resourceLine -replace '^GVM_UGLC_RESOURCE_DIR:PATH=', ''
          cmake -S tests/install `
            -B build/gvm-smoke-consumer-${{ matrix.logging }} `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$PWD/build/gvm-install-prefix-${{ matrix.logging }}" `
            -DCPM_SOURCE_CACHE="$PWD/.cache/cpm" `
            -DGVM_UGLC_EXECUTABLE="$PWD/build/gvm-install-check-${{ matrix.logging }}/UGLC.exe" `
            -DGVM_UGLC_RESOURCE_DIR="$resourceDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/gvm-smoke-consumer-${{ matrix.logging }} --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/gvm-smoke-consumer-${{ matrix.logging }} --output-on-failure -E installed_generated_compute
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shared dependency configuration and rejection
        shell: pwsh
        run: >-
          node tests/install/check-dependencies.mjs
          --consumer-build build/gvm-smoke-consumer-${{ matrix.logging }}
          --ctest-exclude installed_generated_compute
      - name: Verify multi-config CMake consumer
        if: matrix.logging == 'OFF'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S tests/dependencies -B build/gvm-multiconfig-consumer `
            -G "Ninja Multi-Config" `
            -DCMAKE_PREFIX_PATH="$PWD/build/gvm-install-prefix-OFF" `
            -DCPM_SOURCE_CACHE="$PWD/.cache/cpm"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/gvm-multiconfig-consumer --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/gvm-multiconfig-consumer -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify parent fmt reuse in source and installed consumers
        if: matrix.logging == 'ON'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S tests/fmt -B build/gvm-fmt-source -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DGVM_TEST_SOURCE_DIR="$PWD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/gvm-fmt-source --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/gvm-fmt-source --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/fmt -B build/gvm-fmt-installed -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$PWD/build/gvm-install-prefix-ON" `
            -DCPM_SOURCE_CACHE="$PWD/.cache/cpm"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/gvm-fmt-installed --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/gvm-fmt-installed --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-tests:
    name: Windows CMake / UGLIR + Samples + CPU tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure Windows CMake build (samples and tests)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/windows-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DGVM_BUILD_SAMPLES=ON `
            -DGVM_BUILD_ADVANCED_SAMPLES=OFF `
            -DGVM_BUILD_THREE_SAMPLES=OFF `
            -DGVM_BUILD_TESTS=ON `
            -DUGLC_ENABLE_LEGACY=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build samples, compiler, and test targets
        id: build
        shell: pwsh
        run: cmake --build build/windows-ci --parallel 3
      - name: Verify test registration and execution guards
        shell: pwsh
        run: node --test tests/runners/uglc/node/uglir-contract.test.mjs tests/runners/node/execution-contract.test.mjs tests/runners/uglc/node/readiness-metrics.test.mjs tests/runners/uglc/node/candidate-audit.test.mjs tests/runners/shared/output-policy.test.mjs tests/runners/shared/report-redaction.test.mjs
      - name: Run UGLC tests
        shell: pwsh
        run: >-
          node tests/runners/uglc/node/cli.mjs run --group all
          --build-dir build/windows-ci --no-build true --no-open-report true
      - name: Run Windows CPU unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >-
          node tests/runners/node/cli.mjs run --profile windows-debug --group unit
          --build-dir build/windows-ci --no-open-report true
      - name: Run Windows SPIR-V validation tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >-
          node tests/runners/node/cli.mjs run --profile windows-debug --group spirv
          --build-dir build/windows-ci --no-open-report true
      - name: Run Windows DSL codegen tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >-
          node tests/runners/node/cli.mjs run --profile windows-debug --group codegen
          --build-dir build/windows-ci --no-open-report true
      - name: Run Windows CPU TaskGraph tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >-
          node tests/runners/node/cli.mjs run --profile windows-debug --target gvm_dsl_task_graph_tests
          --build-dir build/windows-ci --no-open-report true

  native-vulkan-windows:
    name: Native Windows Vulkan candidate evidence
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, windows, vulkan-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure UGLIR build on native Windows hardware
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/native-vulkan-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DGVM_BUILD_SAMPLES=ON `
            -DGVM_BUILD_ADVANCED_SAMPLES=OFF `
            -DGVM_BUILD_THREE_SAMPLES=OFF `
            -DGVM_BUILD_TESTS=ON `
            -DUGLC_ENABLE_LEGACY=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        id: build
        shell: pwsh
        run: cmake --build build/native-vulkan-windows --parallel 3
      - name: Run complete compiler suite
        shell: pwsh
        run: >-
          node tests/runners/uglc/node/cli.mjs run --group all
          --build-dir build/native-vulkan-windows --no-build true --no-open-report true
      - name: Run complete native Windows Vulkan backend suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >-
          node tests/runners/node/cli.mjs run --profile windows-debug --group all --backend vulkan
          --build-dir build/native-vulkan-windows --no-open-report true
